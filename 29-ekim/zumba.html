<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>29 Ekim Zumba</title>
<link rel="stylesheet" href="fonts.css">
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../logo.js"></script>
<script src="common.js"></script>
<script>
/*
 * 29 Ekim'e özel Zumba · Story/Reels kurgusu, 18.8 sn, 1080x1920, 30 fps. Ses: kaynak videonun kendi müziği.
 * renderFrame(t) yalnızca zamana bağlıdır. Müzik ~113 BPM: vuruş = 0.5297 sn, ilk güçlü vuruş 1.00 sn.
 *
 *   0.00 – 1.51   Kırmızı blok, kaynaktaki "ZUMBA fitnes" yazısının üstünde: "29 EKİM", "Cumhuriyetimiz 103 yaşında!"
 *   1.51 – 4.19   Blok şeride daralır: "HEP BİRLİKTE ZUMBA ile kutluyoruz!" (kaynak yazı 4.1 sn'de biter)
 *   4.19 – 13.7   Dans; güçlü vuruşlarda hafif zoom, etiketler: "Cumhuriyet coşkusu / Zumba enerjisi!", "Sen de / aramıza katıl!"
 *  13.72 – 14.33  Kırmızı perde sağdan sola geçer (kaynaktaki hazır geçiş ve yatay kadraj çıkarıldı)
 *  14.03 – 18.83  Krem kapanış: bayrak, "29 EKİM", kutlama, grubun yatay çekimi kartta, WhatsApp, logo
 */
const FPS = 30, DUR = 565 / FPS, MAIN_END = 421 / FPS;
const BEAT = k => 1.0 + 0.5297 * k;
const DOWN = Array.from({ length: 13 }, (_, i) => BEAT(2 * i));          // 1.00, 2.06 … 13.71
const ALL = Array.from({ length: 27 }, (_, i) => BEAT(i - 1));            // 0.47 … 14.24

const bump = (t, hits, amt, k = 9) => hits.reduce((s, h) => t >= h ? s + amt * Math.exp(-(t - h) * k) : s, 1);

// ---------- kaynak kareler ----------
const cache = new Map();
async function frame(kind, i) {
  const key = kind + i;
  if (cache.has(key)) return cache.get(key);
  const img = await loadImage(`build/${kind}/${String(i).padStart(4, '0')}.jpg`);
  cache.set(key, img);
  if (cache.size > 16) cache.delete(cache.keys().next().value);
  return img;
}
const mainIndex = t => Math.min(420, Math.round(t * FPS));
const wideIndex = t => clamp(464 + Math.round((t - 15.25) * FPS), 464, 563);

// ---------- dans bölümü ----------
function drawVideo(img, t) {
  const s = bump(t, DOWN, 0.035);
  ctx.save(); ctx.translate(540, 960); ctx.scale(s, s);
  ctx.filter = 'contrast(1.06) saturate(1.1)';
  ctx.drawImage(img, -540, -960, W, H);
  ctx.restore();
  // logonun okunması için üstte hafif koyuluk
  const g = ctx.createLinearGradient(0, 0, 0, 420);
  g.addColorStop(0, 'rgba(10,10,20,0.42)'); g.addColorStop(1, 'rgba(10,10,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 420);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 18; logo(540, 214, 250, true); ctx.restore();
}

// Bloğun içindeki satırlar: küçük başlık · büyük kelime · italik alt satır
function bandLines(t, t0, tOut, lines, { small, big, serif }) {
  const p = prog(t, t0, t0 + 0.32), q = tOut == null ? 0 : prog(t, tOut, tOut + 0.08);
  if (p <= 0 || q >= 1) return;
  const pulse = bump(t, ALL.filter(h => h > t0 + 0.2), 0.045, 12);
  ctx.save(); ctx.globalAlpha *= 1 - q;
  ctx.save(); ctx.translate(0, lines[1]);
  ctx.scale(pulse * (1 + 0.5 * (1 - easeOutExpo(p))), pulse * (1 + 0.5 * (1 - easeOutExpo(p))));
  ctx.globalAlpha *= clamp(p * 6);
  text(big, 0, 0, { size: lines[3], color: C.white, weight: 900, ls: -6, maxW: 900 });
  ctx.restore();
  const p2 = easeOutCubic(prog(t, t0 + 0.08, t0 + 0.4)), p3 = easeOutCubic(prog(t, t0 + 0.2, t0 + 0.55));
  ctx.save(); ctx.globalAlpha *= p2; ctx.translate(0, lines[0] + 30 * (1 - p2));
  text(small, 0, 0, { size: 44, color: C.white, weight: 800, ls: 7, maxW: 880 }); ctx.restore();
  ctx.save(); ctx.globalAlpha *= p3; ctx.translate(0, lines[2] - 30 * (1 - p3));
  text(serif, 0, 0, { size: lines[4], color: C.white, weight: 400, family: SERIF, style: 'italic', ls: -1, maxW: 900 }); ctx.restore();
  ctx.restore();
}
// Açılış bloğu: ilk karede tam opak (alttaki yazıyı kapatır), 1.51'de şeride daralır, 4.12'de sola fırlar
function hookBand(t) {
  if (t > 4.4) return;
  const k = easeInOutCubic(prog(t, 1.42, 1.6));
  const hh = lerp(415, 262, k), cy = lerp(1300, 1272, k);
  const pIn = easeOutExpo(prog(t, 0, 0.3)), q = easeInCubic(prog(t, 4.12, 4.36));
  const sc = 1 + 0.15 * (1 - pIn) + 0.02 * (bump(t, DOWN.slice(0, 4), 1, 10) - 1);
  ctx.save(); ctx.translate(540 - 1700 * q, cy); ctx.rotate(lerp(-0.13, -0.07, pIn)); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(60,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  const g = ctx.createLinearGradient(0, -hh, 0, hh);
  g.addColorStop(0, '#EE1B26'); g.addColorStop(1, C.redD);
  ctx.fillStyle = g; ctx.fillRect(-900, -hh, 1800, 2 * hh);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(-900, -hh + 16, 1800, 5); ctx.fillRect(-900, hh - 21, 1800, 5);
  bandLines(t, -0.2, 1.42, [-178, 78, 196, 280, 80],
    { small: 'CUMHURİYET BAYRAMI’NA ÖZEL', big: '29 EKİM', serif: 'Cumhuriyetimiz 103 yaşında!' });
  bandLines(t, 1.51, null, [-142, 68, 168, 250, 76],
    { small: 'HEP BİRLİKTE', big: 'ZUMBA', serif: 'ile kutluyoruz!' });
  ctx.restore();
}

// Yapıştırma etiketi: vuruşta "pat" diye girer
function sticker(str, x, y, t, { t0, t1 = null, rot = 0, bg = C.red, fg = C.white, size = 76 }) {
  const p = prog(t, t0, t0 + 0.38), q = t1 == null ? 0 : prog(t, t1, t1 + 0.18);
  if (p <= 0 || q >= 1) return;
  const sc = Math.max(0, easeOutBack(p, 2.4)) * (1 - easeInCubic(q)) * bump(t, ALL.filter(h => h > t0 + 0.3), 0.03, 12);
  setFont('', 900, size, SANS, -1);
  const w = ctx.measureText(str).width + size * 0.9, h = size * 1.45;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * (1 + 1.5 * (1 - easeOutCubic(p)))); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 18); ctx.fillStyle = bg; ctx.fill();
  ctx.shadowColor = 'transparent';
  text(str, 0, size * 0.36, { size, color: fg, weight: 900, ls: -1, maxW: 2000 });
  ctx.restore();
}
function captions(t) {
  sticker('Cumhuriyet coşkusu', 520, 1495, t, { t0: BEAT(8), t1: BEAT(15), rot: -0.05, bg: C.white, fg: C.red });
  sticker('Zumba enerjisi!', 575, 1608, t, { t0: BEAT(9), t1: BEAT(15), rot: 0.035 });
  sticker('Sen de', 500, 1495, t, { t0: BEAT(16), rot: -0.05 });
  sticker('aramıza katıl!', 570, 1608, t, { t0: BEAT(17), rot: 0.035, bg: C.white, fg: C.red });
}

// Kırmızı perde: sağdan girer, 14.03'te ekranı kaplar, sola çıkarken kapanışı açar
function wipe(t) {
  const p = prog(t, 13.72, MAIN_END), q = prog(t, MAIN_END, 14.33);
  if (p <= 0 || q >= 1) return;
  const x = q > 0 ? -1900 * easeOutCubic(q) : 1900 * (1 - easeInCubic(p));
  ctx.save(); ctx.translate(540 + x, 960); ctx.rotate(-0.1);
  ctx.fillStyle = C.red; ctx.fillRect(-1000, -1400, 2000, 2800);
  ctx.fillStyle = C.white; ctx.fillRect(-1000, -1400, 46, 2800); ctx.fillRect(954, -1400, 46, 2800);
  ctx.restore();
}

// ---------- kapanış ----------
const CONFETTI = (() => { const r = rng(1923); return Array.from({ length: 34 }, () => ({
  x: r() * W, y0: -80 - r() * 900, v: 230 + r() * 240, s: 10 + r() * 14, a: r() * TAU, va: (r() - .5) * 7,
  sw: 20 + r() * 40, f: 0.6 + r() * 1.2, c: r() < 0.75 ? C.red : C.gold })); })();
function confetti(t) {
  const d = t - 14.25;
  if (d <= 0) return;
  for (const c of CONFETTI) {
    const y = c.y0 + c.v * d, x = c.x + c.sw * Math.sin(c.f * TAU * d + c.a);
    if (y > H + 40) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(c.a + c.va * d); ctx.scale(1, Math.cos(c.f * 4 * d + c.a));
    ctx.globalAlpha = 0.85; ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s * 0.3, c.s, c.s * 0.6);
    ctx.restore();
  }
}
function endCard(t, wide) {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(540, 520, 60, 540, 620, 1100);
  g.addColorStop(0, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.red; ctx.lineWidth = 4; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.roundRect(36, 36, W - 72, H - 72, 30); ctx.stroke(); ctx.globalAlpha = 1;
  confetti(t);

  const pf = prog(t, 14.16, 14.7);
  wavingFlag(540, 405 - 120 * (1 - easeOutCubic(pf)), 400, t, { amp: 0.07, waves: 1.3, alpha: clamp(pf * 3), scale: lerp(0.7, 1, easeOutBack(pf, 2)) });

  const p29 = prog(t, BEAT(25), BEAT(25) + 0.4);
  if (p29 > 0) {
    const s = (1 + 0.6 * (1 - easeOutExpo(p29))) * bump(t, [BEAT(27), BEAT(29), BEAT(31)], 0.03, 10);
    ctx.save(); ctx.globalAlpha = clamp(p29 * 5); ctx.translate(540, 712); ctx.scale(s, s);
    text('29 EKİM', 0, 88, { size: 236, color: C.red, weight: 900, ls: -8, maxW: 880 }); ctx.restore();
  }
  const ps = easeOutCubic(prog(t, BEAT(26), BEAT(26) + 0.45));
  ctx.save(); ctx.globalAlpha = ps; ctx.translate(0, 30 * (1 - ps));
  text('Cumhuriyet Bayramımız kutlu olsun!', 540, 905, { size: 76, color: C.navy, weight: 400, family: SERIF, style: 'italic', ls: -1, maxW: 930 });
  ctx.restore();

  const pc = prog(t, 15.25, 15.8);
  if (pc > 0 && wide) {
    const cw = 900, ch = 506, b = 10, s = lerp(0.88, 1, easeOutBack(pc, 1.6));
    ctx.save(); ctx.globalAlpha = clamp(pc * 4); ctx.translate(540, 1218 + 140 * (1 - easeOutCubic(pc))); ctx.scale(s, s);
    ctx.shadowColor = 'rgba(60,30,10,0.25)'; ctx.shadowBlur = 44; ctx.shadowOffsetY = 18;
    ctx.beginPath(); ctx.roundRect(-cw / 2 - b, -ch / 2 - b, cw + 2 * b, ch + 2 * b, 40); ctx.fillStyle = C.white; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.roundRect(-cw / 2, -ch / 2, cw, ch, 32); ctx.clip();
    ctx.filter = 'contrast(1.06) saturate(1.1)'; drawCover(wide, -cw / 2, -ch / 2, cw, ch, 0.5, 0.5, 1.02); ctx.filter = 'none';
    ctx.restore();
  }

  const pp = prog(t, BEAT(29), BEAT(29) + 0.4);
  if (pp > 0) {
    const sc = Math.max(0, easeOutBack(pp, 2.2));
    ctx.save(); ctx.translate(540, 1568); ctx.scale(sc, sc);
    const str = 'DETAYLAR İÇİN WHATSAPP · 0533 071 33 73';
    setFont('', 800, 32, SANS, 2);
    const w = ctx.measureText(str).width + 64, h = 70;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = C.red; ctx.fill();
    text(str, 0, 12, { size: 32, color: C.white, weight: 800, ls: 2, maxW: 2000 });
    ctx.restore();
  }
  const pl = easeOutCubic(prog(t, BEAT(30), BEAT(30) + 0.5));
  if (pl > 0) logo(540, 1694 + 30 * (1 - pl), 290, false, pl);
}

// ---------- kare ----------
async function renderFrame(t) {
  if (t < MAIN_END) {
    const img = await frame('v', mainIndex(t));
    drawVideo(img, t); hookBand(t); captions(t);
  } else {
    endCard(t, t >= 15.25 ? await frame('w', wideIndex(t)) : null);
  }
  wipe(t);
}

window.FPS = FPS; window.DUR = DUR; window.renderFrame = renderFrame;
window.ready = (async () => {
  await loadFonts(); await loadLogos();
  const q = new URLSearchParams(location.search);
  if (q.has('render')) return;
  if (q.has('t')) return renderFrame(+q.get('t'));
  // Önizleme: tarayıcıda gerçek zamanlı oynat (tıklayınca başa sarar)
  let start = performance.now();
  cv.addEventListener('click', () => start = performance.now());
  const loop = async () => { await renderFrame(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body>
</html>
