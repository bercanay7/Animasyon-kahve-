<script>window.FIG_T = 0; const NOTEXT = false; const FONT = { manset: px => `400 ${px}px Anton`, alinti: (px, w = 600) => `italic ${w} ${px}px "Cormorant Garamond"`, metin: (px, w = 600) => `${w} ${px}px "Cormorant Garamond"`, daktilo: (px, w = 700) => `${w} ${px}px "Courier Prime"` };
function wrapLines(ctx, s, maxW) { const out = []; for (const par of String(s).split('\n')) { let ln = ''; for (const w of par.split(' ')) { const tt = ln ? ln + ' ' + w : w; if (ctx.measureText(tt).width > maxW && ln) { out.push(ln); ln = w; } else ln = tt; } out.push(ln); } return out; }</script>
