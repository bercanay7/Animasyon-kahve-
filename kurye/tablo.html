<canvas id="c" width="1920" height="1080"></canvas>
<script src="../araclar/hareket/hareket.js"></script>

<script type="module">
// "Mektuplar": yağlıboya canlanan resim (Zaman Kuryesi'nin kimlik filmi denemesi).
// Gün batımında yalnız meşeye uzanan tarla. Kurye patikada yürür, durur, güneşe döner, çantasını açar; rüzgâr mektupları alır,
// kâğıtlar havada döne döne kuşa dönüşür ve güneşe uçar.
// Motor: dorian-gray/kapi/vendor (impasto + plate; Lemo-Opuscar, MIT). Durağan katmanlar yüklenirken bir kez boyanır (Hertzmann: kaba → ince).
// Canlı katmanlar her iki karede bir yeniden boyanır (15 çizim/sn): figür (3B manken → darbe), rüzgârdaki başaklar, ışık, mektup/kuş, polen.
// Belirlenimci: Math.random yok; tohumlar t'den.
import { Impasto, Strokes, KNIFE, BRUSH, DAB } from '../araclar/tablo/impasto.js';
import { Ref, paintRef } from '../araclar/tablo/plate.js';
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, T = window.TABLO, I = window.ISKELET, V = I.V, HR = window.HAREKET, MK = window.MANKEN;
const sm = HR.yumusak, PI = Math.PI;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
window.FPS = 30; window.DUR = 25;
const ikiser = t => Math.floor(t * 15 + 1e-6) / 15;
const hsh = (a, b = 0, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
let E, glc;

// ---------------- 3B kamera: resmin perspektifiyle eşleşir (ufuk y = 700, dikey görüş 40°) ----------------
const ODAK = 540 / Math.tan(20 * PI / 180), EGIM = Math.atan((T.UFUK - 540) / ODAK);
const KAMERA = { konum: [0, 1.6, 0], hedef: [0, 1.6 + Math.tan(EGIM) * 10, -10], fov: 40, yakin: .1, uzak: 200 };
const GUNES_IS = { tip: 'yon', konum: [4, 5.2, -100], hedef: [-1.6, 0, -9.6], alan: 4, uzak: 140, kazanc: 1.9 };
// ---------------- zaman çizelgesi (v2: bağımsız eleştiriden; tek mektup, rüzgâr, ağacın cevabı, ışığın değişimi) ----------------
// 0–7 kurye soldan girer, patikada durur · 7.2 başını ağaca kaldırır · 8.6 çantaya uzanır, tek mektup çıkarır, göğsünde tutar
// 11 sol uzaktan rüzgâr dalgası başakları yatırarak gelir · 12.2 dalga kuryeye varır, mektubu alır · 12.2–18.8 mektup döne döne meşeye
// 18.8 mektup tacın içine konar; taçtan çiçek gibi açık lekeler yayılır · 17–25 güneş tepelerin ardına batar, ışık soğur
const tDur = 7.0, tBak = 7.2, tUz0 = 8.6, tCik = 9.8, tSal = 12.2, tVar = 16.6, tBat0 = 17, tBat1 = 25;
const g = HR.yuruyus({ tip: 'yuru' });
const A0 = [-5.6, -5.6], YAW = Math.atan2(3.85, -4.0);
const go = t => HR.rampa(t, -.6, .1) * (1 - HR.rampa(t, tDur - .8, tDur));
const yol = HR.yuruyusYolu(g, { t0: -1.5, t1: 26, x0: 0, olcek: 1, go });
const KAY = 1.0;                                                  // yürüyüş filmden 1 sn önce başlar: kurye ~1. saniyede kareye girer
const yuruPoz = t => I.yuruyus3B(yol, t + KAY, { bas: A0, yaw: YAW, kolGenlik: .3 });
const SON = yuruPoz(26), DY = [SON.kok[0], SON.kok[2]];
// patika (dünya, metre): arkadan gelir, kuryenin durduğu yerden geçer, meşenin dibine kıvrılır
const PATIKA = [[A0[0] - 2.2 + .3, A0[1] + 2.3], [A0[0] + .3, A0[1]], [DY[0] + .3, DY[1]], [DY[0] + 2.6, DY[1] - 6.4], [5.6, -27], [12.8, -54]];
const YAW2 = YAW + .32;                                           // biraz ağaca döner
const tD0 = tDur - KAY + .1, tD1 = tD0 + .9;
const bakYay = HR.yayIzi({ hedef: t => (t < tBak ? 0 : t < 22.2 ? 1 : .35), k: 9, d: 5, t0: -1, t1: 26 });
const kolYay = HR.yayIzi({ hedef: t => (t < tUz0 ? 0 : t < tCik ? 1 : t < tSal ? 2 : t < tSal + .5 ? 3 : 4), k: 26, d: 8, t0: -1, t1: 26 });
function kuryePoz(t) {
  t = ikiser(t);
  if (t < tD0) return yuruPoz(t);
  const son = yuruPoz(tD0), dur = I.POZ.dur([DY[0], DY[1]], YAW2, { basEgim: .04 });
  let p;
  if (t < tD1) {
    const u = (t - tD0) / (tD1 - tD0); p = I.karistir(son, dur, sm(0, 1, u));
    for (const i of [0, 1]) { const a0 = i ? .4 : 0, ui = sm(a0, a0 + .5, u);
      p.ayak[i].bilek = V.lerp(son.ayak[i].bilek, dur.ayak[i].bilek, ui); p.ayak[i].bilek[1] += .05 * Math.sin(PI * ui); p.ayak[i].egim = 14 * Math.sin(PI * ui); }
  } else p = I.karistir(dur, dur, 0);
  // ağırlık aktarımı ve nefes (durduktan sonra)
  const w = sm(tD1, tD1 + 1, t);
  p.kok = [p.kok[0] + .018 * Math.sin((t - tD1) * .8) * w, p.kok[1] - .006 * w, p.kok[2]];
  p.yan = (p.yan || 0) + .03 * Math.sin((t - tD1) * .8) * w;
  p.gogusEgim = (p.gogusEgim || 0) + .012 * Math.sin(t * 1.7) * w;
  // kol: çantaya uzanır, mektubu göğüs hizasında tutar, rüzgâra bırakır (el omuzun altında kalır), sonra iner
  const K0 = I.kemikler(p), pel = K0.pelvis, k = kolYay(t);
  const canta = V.add(V.add(pel.o, V.mul(pel.x, -.24)), V.mul(pel.y, .02));
  const om = K0.kol[1].omuz;
  const tut = V.add(V.add(om, V.mul(pel.z, .36)), V.add(V.mul(pel.y, -.22), V.mul(pel.x, .02)));
  const bir = V.add(V.add(om, V.mul(pel.z, .46)), V.add(V.mul(pel.y, -.1), V.mul(pel.x, -.06)));
  const ind = K0.kol[1].bilek;
  const yol4 = [ind, canta, tut, bir, ind];
  if (k > .02) { const i = Math.min(3, Math.floor(k)), f = k - i; p.kol[1] = { hedef: V.lerp(yol4[i], yol4[i + 1], i === 3 ? f * .8 : f) }; }
  const b = bakYay(t);
  p.basEgim = (p.basEgim || 0) - .34 * b; p.basDon = (p.basDon || 0) - .22 * b;
  return p;
}
// çanta: sol kalçada, sarkaç
const cantaSarkac = HR.sarkacIzi({ kuvvet: t => -HR.ivme(yol)(t + KAY) * I.S * 8, k: 15, d: 2, t0: -1.5, t1: 26, itmeler: [[tUz0 + .5, .8], [tCik, -.6]] });
function kutuM(o, x, y, z, s) { return new Float32Array([x[0] * s[0], x[1] * s[0], x[2] * s[0], 0, y[0] * s[1], y[1] * s[1], y[2] * s[1], 0, z[0] * s[2], z[1] * s[2], z[2] * s[2], 0, o[0], o[1], o[2], 1]); }
function canta(K, t) {
  const pel = K.pelvis, a = cantaSarkac(ikiser(t));
  const kok = V.add(V.add(pel.o, V.mul(pel.x, -.19)), V.mul(pel.y, .1));
  const asagi = V.rot(V.mul(pel.y, -1), pel.z, a);
  const mrk = V.add(kok, V.mul(asagi, .15)), y = V.mul(asagi, -1), x = pel.x, z = V.cross(x, y);
  MK.ekle('kutu1', kutuM(mrk, x, y, z, [.08, .22, .28]), { renk: [.34, .2, .14], kim: 251, es: [.08, .22, .28] });
  // askı: çapraz kayış (sağ omuzdan sol kalçaya)
  const om = K.kol[0].omuz, a1 = V.add(om, V.mul(K.gogus.z, -.01)), uz = V.sub(kok, a1), L = V.len(uz), yy = V.mul(uz, 1 / L), zz = K.gogus.z, xx = V.cross(yy, zz);
  MK.ekle('kutu1', kutuM(V.lerp(a1, kok, .5), xx, yy, zz, [.035, L, .2]), { renk: [.2, .12, .1], kim: 251, es: [.035, L, .2] });
  return mrk;
}
// şapka: geniş kenarlı (arkadan bakınca okunan siluet; başın eğimini gösterir)
// palto eteği: kalçadan dizin üstüne; yürürken bacaklar altından görünür, durunca siluete insan biçimi verir
function palto(K) {
  const p = K.pelvis, o = V.add(p.o, V.mul(p.y, -.2));
  MK.ekle('karin', kutuM(o, p.x, p.y, p.z, [1.14, 1.3, 1.2]), { renk: [.2, .15, .17], kim: 251 });
}
function sapka(K) {
  const b = K.bas, o = V.add(V.add(b.o, V.mul(b.y, .155)), V.mul(b.z, .02));
  MK.ekle('pazu', kutuM(o, b.x, b.y, b.z, [2.3, .3, 2.5]), { renk: [.16, .12, .14], kim: 251 });                       // tepe
  MK.ekle('pazu', kutuM(V.add(o, V.mul(b.y, .006)), b.x, b.y, b.z, [3.7, .07, 4.0]), { renk: [.14, .1, .12], kim: 251 }); // kenar
}

// ---------------- durağan katmanlar (bir kez boyanır, önbellekten basılır) ----------------
const KAT = {};
function katman(ad, ciz, d, o = {}) {
  const Rf = new Ref(W, H, o.olcek ?? .5);
  const R = { fill: (pf, c, p) => Rf.fill(pf, c, { seed: 1, ...p }), line: (pf, c, w, p) => Rf.line(pf, c, w, p || {}), text: (s, x, y, f, c, p) => Rf.text(s, x, y, f, c, p || {}) };
  ciz(R);
  const t0 = performance.now();
  const st = paintRef(Rf, { R: o.R || [26, 13, 6.5, 3.2, 1.7], T: o.T ?? 12, seed: o.seed ?? 3 });
  const b = E.batch(st.data()), tex = E.texture(Rf.ctx.canvas, 1.2);
  const k = E.onbellek(() => { E.under(tex, W, H, { t: 10 }); E.draw(b, { t: 10, wet: .35 }); });
  const gl = E.gl; gl.deleteBuffer(b.buf); gl.deleteVertexArray(b.vao); gl.deleteTexture(tex);
  KAT[ad] = { k, n: st.n, d, sure: performance.now() - t0 };
}
// kamera: yavaş yaklaşma; katman derinliği d: 0 gök … 1 ön plan
// kamera koreografisi (v3): geniş açılış → kurye mektubu çıkarırken ona yaklaşır → mektubu meşeye kadar izler → güneş batarken geri açılır
const KAM = [[0, 960, 540, 1], [5.5, 900, 575, 1.06], [10.4, 700, 700, 1.2], [12.4, 730, 680, 1.19], [15.6, 960, 520, 1.14], [18.6, 1080, 480, 1.17], [25, 1000, 545, 1.04]];
function kamera(t) {
  let i = 0; while (i < KAM.length - 2 && t > KAM[i + 1][0]) i++;
  const a = KAM[i], b = KAM[i + 1], u = sm(a[0], b[0], Math.max(a[0], Math.min(b[0], t)));
  return { x: a[1] + (b[1] - a[1]) * u, y: a[2] + (b[2] - a[2]) * u, z: a[3] + (b[3] - a[3]) * u };
}
// katmanın kamerası: derinliğe göre kayma ve yaklaşma; görüş resmin içinde tutulur (kenarın ötesi boş)
const camK = (k, d) => { const zoom = 1 + (k.z - 1) * (.35 + d * .9), hw = W / 2 / zoom, hh = H / 2 / zoom, px = 0, py = 0;   // resim 0..W × 0..H içinde çizili (Ref tuvali); önbellek payı boş
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  return { x: cl(960 + (k.x - 960) * (.4 + d * .7), -px + hw, W + px - hw), y: cl(540 + (k.y - 540) * (.4 + d * .7), -py + hh, H + py - hh), zoom, rot: 0 }; };
// bir noktanın çevresinde döndürülmüş kamera (meşe rüzgârda gövdesinin dibinden eğilir)
const camDon = (c, P, th) => { const cr = Math.cos(th), sr = Math.sin(th), vx = c.x - P[0], vy = c.y - P[1]; return { ...c, x: P[0] + cr * vx + sr * vy, y: P[1] - sr * vx + cr * vy, rot: th }; };

// ---------------- rüzgâr ----------------
// dalga: soldan sağa geçen tek büyük esinti (11–15 sn) + sürekli hafif esinti
const dalgaX = t => -420 + (t - 10.6) * 820;
const dalga = (x, t) => (t < 10 || t > 16) ? 0 : Math.exp(-Math.pow((x - dalgaX(t)) / 300, 2)) * sm(10, 10.8, t) * (1 - sm(15, 16, t));
const agacSal = t => .003 * Math.sin(t * .8) + .0012 * Math.sin(t * 2.3 + 1) + (t > 12.75 ? .009 * Math.sin((t - 12.75) * 3.6) * Math.exp(-(t - 12.75) * .9) : 0) + (t > tVar ? .004 * Math.sin((t - tVar) * 4.2) * Math.exp(-(t - tVar) * 1.4) : 0);
const gunesY = t => T.GUNES[1] + 92 * sm(tBat0, tBat1, t);

// ---------------- canlı katmanlar ----------------
let BASAK = [];
function basakKur(patikaEkran) {
  let s = 11; const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const patikada = (x, y) => { for (let i = 0; i < patikaEkran.length - 1; i++) { const a = patikaEkran[i], b = patikaEkran[i + 1]; if (y < Math.min(a[1], b[1]) || y > Math.max(a[1], b[1])) continue; const u = (y - a[1]) / (b[1] - a[1] || 1); if (Math.abs(x - (a[0] + (b[0] - a[0]) * u)) < (a[2] + (b[2] - a[2]) * u) * 1.1) return true; } return false; };
  // uzakta tek tek başak çizilmez (doku durağan katmanda); yakına doğru sıklaşır ve büyür
  for (let i = 0; i < 2600; i++) {
    const d = Math.pow(r(), .75), y = 786 + d * 306, x = -40 + r() * 2000;
    if (patikada(x, y)) continue;
    const L = 8 + Math.pow(d, 1.4) * 70 * (.7 + r() * .6);
    if (d < .3 && r() < .6) continue;
    const taban = [.5 - d * .36, .3 - d * .2, .18 - d * .1], uc = [1, .74 - d * .08, .44 - d * .1].map(v => v * (.72 + r() * .35) * (1 - d * .45));
    BASAK.push({ x, y, d, L, w: 1.3 + d * 3.4, taban, uc, f: r() * 6.28, eg: (r() - .5) * .25, bas: false });
  }
  BASAK.sort((a, b) => a.y - b.y);
}
function basaklar(t, S) {
  for (const b of BASAK) {
    const dl = dalga(b.x, t);
    const dal = .16 * Math.sin(b.x * .005 + b.y * .003 - t * 1.6) + .06 * Math.sin(b.x * .031 - t * 3.1 + b.f) + .55 * dl * (1 + .3 * Math.sin(t * 9 + b.f));
    const a = -PI / 2 + b.eg + dal * (.55 + b.L / 90);
    const isik = 1 + .55 * dl;                             // yatan başağın açık alt yüzü ışığı yakalar
    const uc = b.uc.map(v => Math.min(1, v * isik));
    S.push({ x: b.x + Math.cos(a) * b.L / 2, y: b.y + Math.sin(a) * b.L / 2, ang: a, len: b.L, wid: b.w, c: b.taban, c2: uc, seed: b.f * 100, type: BRUSH, hgt: .5, bend: dal * .8, taper: .7 });
    if (b.bas) { const ux = b.x + Math.cos(a) * b.L * .95, uy = b.y + Math.sin(a) * b.L * .95;
      S.push({ x: ux, y: uy, ang: a, len: b.L * .18 + 3, wid: b.w * 1.5, c: uc, c2: uc.map(v => v * .8), seed: b.f * 37, type: DAB, hgt: .5 }); }
  }
}
// güneş diski: yatay sürütülmüş yumuşak disk (halka darbe yok); çevresinde ışıma
function gunes(t, S) {
  const [gx] = T.GUNES, gy = gunesY(t), r = 31;
  for (let i = 0; i < 5; i++) S.push({ x: gx, y: gy, ang: 0, len: 150 + i * 70, wid: 90 + i * 46, c: [1, .9, .66], seed: i, type: DAB, alpha: .08, hgt: .02 });
  for (let k = -5; k <= 5; k++) { const yy = k / 5.6 * r, ww = Math.sqrt(Math.max(0, r * r - yy * yy)) * 2;
    S.push({ x: gx + (hsh(k, 3) - .5) * 3, y: gy + yy, ang: (hsh(k, 4) - .5) * .05, len: ww + 4, wid: r / 4.2, c: [1, .97, .88], c2: [1, .9, .72], seed: k + 40, type: BRUSH, hgt: .15, alpha: .95 }); }
}
function huzmeler(t, S) {
  const gx = T.GUNES[0], gy = gunesY(t), sn = 1 - sm(tBat0, tBat1 - 1.5, t);
  for (let i = 0; i < 14; i++) {
    const a = -PI * .02 + (i / 13) * PI * 1.04 + .03 * Math.sin(t * .2 + i), L = 520 + 380 * hsh(i, 2), w = 28 + 70 * hsh(i, 3);
    const al = (.04 + .045 * hsh(i, 5)) * (.65 + .35 * Math.sin(t * .35 + i * 1.7)) * sn;
    if (al < .003) continue;
    S.push({ x: gx + Math.cos(a) * L * .55, y: gy + Math.sin(a) * L * .55 * .8, ang: a, len: L, wid: w, c: [1, .86, .62], c2: [1, .74, .5], seed: i * 13, type: BRUSH, alpha: al, hgt: .02, taper: .8 });
  }
}
function polen(t, S) {
  const gx = T.GUNES[0], gy = gunesY(t);
  for (let i = 0; i < 70; i++) {
    const a = hsh(i, 1) * PI * 2, r0 = 80 + 480 * Math.sqrt(hsh(i, 2));
    const x = gx + Math.cos(a) * r0 * 1.5 + 40 * Math.sin(t * .3 + i) + t * 7, y = gy + Math.sin(a) * r0 * .6 + 20 * Math.sin(t * .45 + i * 2.1) - t * 2;
    if (y > 980) continue;
    const yak = Math.max(0, 1 - Math.hypot(x - gx, (y - gy) * 1.6) / 700);
    S.push({ x, y, ang: hsh(i, 4) * PI, len: 2.5 + 2.5 * hsh(i, 5), wid: 2 + 1.6 * hsh(i, 6), c: [1, .86, .62], seed: i, type: DAB, alpha: .25 + .5 * yak, hgt: .1 });
  }
}
// mektup: katlanmış zarf; bir yüzü ışıkta (sıcak krem), öbür yüzü gölgede (mor); kapak çizgisi yalnız ön yüzde
function zarf(S, x, y, boy, ang, cev, al = 1) {
  const on = cev >= 0, k = Math.abs(cev), h = boy * .64;
  const yuz = on ? [.99, .9, .74] : [.56, .44, .54], yuz2 = on ? [1, .8, .6] : [.46, .36, .48];
  // genişlik dönüşle daralır (kâğıt yüzü kameraya döner)
  const L = boy, Wd = h * (.18 + .82 * k);
  S.push({ x, y, ang, len: L, wid: Wd, c: yuz, c2: yuz2, seed: 77, type: KNIFE, alpha: al, hgt: .5 });
  if (on && k > .35) {
    const ca = Math.cos(ang), sa = Math.sin(ang), P = (u, v) => [x + ca * u * L - sa * v * Wd, y + sa * u * L + ca * v * Wd];
    for (const sg of [-1, 1]) { const A = P(sg * .5, -.5), B = P(0, .12);
      S.push({ x: (A[0] + B[0]) / 2, y: (A[1] + B[1]) / 2, ang: Math.atan2(B[1] - A[1], B[0] - A[0]), len: Math.hypot(B[0] - A[0], B[1] - A[1]) * 1.05, wid: Math.max(1.1, boy * .045), c: [.72, .52, .42], seed: 5 + sg, type: 3, alpha: al * .9, hgt: .2 }); }
  }
}
const KONUS = [1050, 318];                              // mektubun tacın içinde konduğu yer
function mektupYer(t, el) {
  const a = t - tSal, u = sm(0, tVar - tSal, a);
  const P0 = el, C1 = [el[0] - 140, el[1] - 360], C2 = [el[0] + 230, 170], P3 = KONUS;
  const b = (p0, p1, p2, p3) => { const v = 1 - u; return v * v * v * p0 + 3 * v * v * u * p1 + 3 * v * u * u * p2 + u * u * u * p3; };
  const x = b(P0[0], C1[0], C2[0], P3[0]) + 34 * Math.sin(a * 2.3) * (1 - u), y = b(P0[1], C1[1], C2[1], P3[1]) + 20 * Math.cos(a * 3.1) * (1 - u);
  const derin = Math.sin(Math.min(1, u * 2.4) * PI / 2) * (1 - u);          // önce bize gelir, sonra uzaklaşır
  const boy = (26 + 40 * derin) * (1 - .55 * u) + 5;
  return { x, y, boy, ang: .7 * Math.sin(a * 2.1) + a * .8, cev: Math.cos(a * 3.4 + .4), u };
}
// çiçekler: tacın içinde bekleyen açık lekeler; mektup konunca konduğu yerden dışa doğru açılır
let CICEK = [];
function cicekKur() {
  const K = T.KUM;
  for (let i = 0, n = 0; n < 135 && i < 4000; i++) { const k = K[(hsh(i, 1) * K.length) | 0], a = hsh(i, 2) * PI * 2, rr = Math.sqrt(hsh(i, 3)) * .82;
    const x = k[0] + Math.cos(a) * k[2] * rr, y = k[1] + Math.sin(a) * k[3] * rr;
    const yan = Math.max(0, Math.min(1, .5 + (T.AGAC.x - x) / 700 + (y - 380) / 500)), d = Math.hypot(x - KONUS[0], (y - KONUS[1]) * 1.3);

}
// cevap: açan çiçeklerden yapraklar kopar, rüzgârla kuryeye doğru süzülür: kenarı yumuşak pul, çizgisiz
function yapraklar(t, S, hedef) {

    const u = sm(0, 4.6 + hsh(i, 4), a), hx = hedef[0] + (hsh(i, 5) - .5) * 160, hy = hedef[1] - 60 - hsh(i, 6) * 160;

// çiçek: iki-üç üst üste binen kısa fırça lekesi (damga değil), kabartmasız; ışık yanında açık, gölgede gül-mor

// tacın kenarı rüzgârda kıpırdar: dış çevrede kısa yaprak darbeleri (her çizimde)

function tacKenar(t, S) {

    S.push({ x: k.x + Math.cos(k.a) * 1.5 * r, y: k.y + Math.sin(k.a) * 1.5 * r, ang: k.a + PI / 2 + r * .5, len: k.s, wid: k.s * .55, c: k.c, c2: k.c.map(v => v * 1.15), seed: k.f * 77, type: BRUSH, hgt: .3, taper: .4 }); }

// figür: 3B manken resmin kamerasıyla çizilir ve fırça darbelerine çevrilir; kenar ışığı güneş yanında
const FIG_OLC = .5;
function figur(t, S) {
  const p = kuryePoz(t);
  MK.begin({ kip: 'boya', t, kamera: KAMERA, isik: GUNES_IS, renkler: { isik: [1, .7, .44], golge: [.32, .25, .38], sis: [0, 0, 0] }, ortam: .5, sis: 0, huzme: 0, toz: 0, kontur: 0, olcek: 1, parilti: 0 });
  const K = MK.figur(p, { giysi: [.2, .15, .17], pantolon: [.15, .12, .14], ten: [.5, .36, .3] });
  const cm = canta(K, t); sapka(K); palto(K);
  MK.cizHam();
  const R = MK.oku(), w = R.w, h = R.h, sc = W / w, cz = Math.floor(t * 15);
  const fig = (x, y) => x >= 0 && y >= 0 && x < w && y < h && R.ek[((h - 1 - y) * w + x) * 4 + 1] === 251;
  const kb = MK.ekran(K.pelvis.o), x0 = Math.max(1, ((kb[0] - 260) / sc) | 0), x1 = Math.min(w - 2, ((kb[0] + 260) / sc) | 0), y0 = Math.max(1, ((kb[1] - 420) / sc) | 0), y1 = Math.min(h - 2, ((kb[1] + 360) / sc) | 0);
  const gx = T.GUNES[0], gy = gunesY(t), hava = [.36, .24, .3], KEN = [], KIS = [];
  // iç: dik, iri darbeler (ızgara + titreşim); kenar: biçimi saran ince darbeler; güneşe bakan kenar altın
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {

    const j = ((h - 1 - y) * w + x) * 4;
    let c = [R.renk[j] / 255, R.renk[j + 1] / 255, R.renk[j + 2] / 255].map((v, i) => v + (hava[i] - v) * .38);

      continue;

    nx += ((fig(x - 1, y - 1) ? 1 : 0) + (fig(x - 1, y + 1) ? 1 : 0) - (fig(x + 1, y - 1) ? 1 : 0) - (fig(x + 1, y + 1) ? 1 : 0)) * .5;

}

function renderFrame(t) {

// mektubun bırakıldığı yer: elin salış anındaki ekran konumu (kare sırasından bağımsız olsun diye yükte hesaplanır)
let SALIS_EL = [700, 820];
const MONO = Q.get('mono') === '1';
