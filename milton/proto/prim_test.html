<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/core.js"></script><script src="../lib/style.js"></script><script src="../lib/gravur.js"></script><script src="../lib/prim.js"></script>
<script>
// Doğa ilkelleri sınama sayfası: ?v=1 duman tonozu + huzme, 2 alevler, 3 kaya, 4 göl, 5 hepsi (gol.js düzenine yakın, figürsüz)
const cv=document.getElementById('c'); cv.width=DW; cv.height=DH; const ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search), V=+(Q.get('v')||5);
function sky(top,bot,y1){ const {tx,tone}=GR; const g=tx.createLinearGradient(0,0,0,y1); g.addColorStop(0,tone(top)); g.addColorStop(1,tone(bot)); tx.fillStyle=g; tx.fillRect(0,0,W,y1); }
function vault(t){ // duman tonozu
  PR.cloud({x:330,y:110,w:1000,h:260,seed:3,lit:[.25,.95],base:.05,hi:.34,drift:Math.sin(t*.1)*10});
  PR.cloud({x:1080,y:150,w:760,h:230,seed:8,lit:[.6,.8],base:.06,hi:.5,drift:Math.sin(t*.08+1)*12});
  PR.cloud({x:240,y:400,w:820,h:180,seed:12,lit:[.55,.85],base:.12,hi:.72});
  PR.cloud({x:1560,y:420,w:820,h:170,seed:17,lit:[-.6,.8],base:.12,hi:.75});
}
function slit(t){ PR.glow(1590,40,4,300,1,.5); PR.rays(1590,40,PI*.58,PI*.9,6,1150,{str:.45,seed:4,t,slit:{w:260,h:30,a:-.1}}); }
function renderFrame(t){ ctx.setTransform(RS,0,0,RS,0,0); const {tx,tone,fill}=GR;
  GR.begin(.1,0,1);
  if(V===1){ sky(.04,.3,H); vault(t); slit(t); }
  if(V===2){ sky(.06,.2,H);
    PR.flameBank(-60,W+60,330,70,t,1,{env:f=>.15+.85*Math.pow(Math.sin(f*PI),2)});
    PR.flameBank(300,1300,600,150,t,5,{env:f=>.35+.65*Math.sin(f*PI)});
    PR.flameBank(1050,1900,1080,380,t,4,{env:f=>.5+.5*f,wr:.5,base:.3}); }
  if(V===3){ sky(.15,.35,H);
    PR.rock([[-20,520],[60,548],[118,600],[196,628],[232,700],[300,742],[322,836],[392,900],[410,H+20],[-20,H+20]],{lit:[.85,-.45],seed:2,rim:3});
    PR.rock([[700,1100],[760,820],[880,700],[1000,690],[1120,760],[1180,860],[1260,900],[1300,1100]],{lit:[.4,-.9],seed:7,rim:3}); }
  if(V===4){ sky(.08,.3,560);
    PR.flameBank(-60,W+60,560,70,t,1,{env:f=>.2+.8*Math.pow(Math.sin(f*PI),2)});
    PR.lake(562,H,t,{tone:[.4,.12],refl:[{x:500,w:150,v:.5},{x:960,w:200,v:.6},{x:1450,w:130,v:.45}]});
    PR.chain(700,700,1100,760,34,{sag:30}); }
  if(V===5){ const FX=800; sky(.04,.5,600);
    PR.glow(FX+40,570,20,520,1,.8);
    vault(t); slit(t);
    let g=tx.createLinearGradient(0,590,0,H); g.addColorStop(0,tone(.55)); g.addColorStop(.12,tone(.28)); g.addColorStop(.5,tone(.14)); g.addColorStop(1,tone(.08)); tx.fillStyle=g; tx.fillRect(0,590,W,H-590);
    PR.lake(592,H,t,{refl:[{x:FX+40,w:260,v:.55,len:300},{x:300,w:120,v:.35},{x:1350,w:140,v:.4}]});
    PR.flameBank(-60,W+60,594,70,t,1,{env:f=>.15+.85*Math.pow(Math.sin(f*PI),2)});
    PR.flameBank(480,1180,650,140,t,5,{env:f=>.35+.65*Math.sin(f*PI)});
    PR.chain(FX-110,770,FX-230,840,34,{sag:10}); PR.chain(FX+130,760,FX+270,838,34,{sag:10});
    PR.flameBank(FX-260,FX+300,840,110,t,7,{env:f=>.35+.65*Math.abs(f-.5)*2,wr:.55});
    PR.flameBank(1450,W+120,H+30,380,t,4,{env:f=>.5+.5*f,wr:.5,base:.3,edge:.4,core:.8});
    PR.rock([[-20,520],[60,548],[118,600],[196,628],[232,700],[300,742],[322,836],[392,900],[410,H+20],[-20,H+20]],{lit:[.85,-.45],hi:.92,mid:.35,lo:.06,seed:2,th:-.9,rim:3}); }
  GR.engrave(ctx); applyPaper(ctx,.8); if(V===5) applyVignette(ctx,.65); }
window.renderFrame=renderFrame; window.renderFrameMB=renderFrame; window.ready=Promise.resolve(buildTextures());
</script></body></html>
