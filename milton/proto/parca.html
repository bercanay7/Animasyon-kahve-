<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/core.js"></script><script src="../lib/style.js"></script><script src="../lib/gravur.js"></script><script src="../lib/prim.js"></script><script src="../lib/kanat.js"></script><script src="../lib/figur.js"></script>
<script>
const cv=document.getElementById('c'); cv.width=DW; cv.height=DH; const ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search);
function renderFrame(t){ ctx.setTransform(RS,0,0,RS,0,0); const {tx,tone}=GR; GR.begin(.82,0,1);
  const g=tx.createLinearGradient(0,0,0,H); g.addColorStop(0,tone(.55)); g.addColorStop(1,tone(.9)); tx.fillStyle=g; tx.fillRect(0,0,W,H);
  const p=Q.get('p')||'kanat';
  if(p==='kanat'){ for(const [i,op,lf] of [[0,1,1],[1,1,.35],[2,.1,1]]){ for(const side of [-1,1]){ GR.frame(330+i*640+side*30, 640, 0, side, 1); KN.feathered({span:300, open:op, lift:lf, t, seed:i*2+(side>0), dark:i===1?.5:0, rim:.5}); GR.unframe(); } } }
  if(p==='figur'){ FG.test(t); }
  GR.engrave(ctx); if(p==='figur') FG.contour(ctx, FG._last, 1.3, .85); applyPaper(ctx,.8); }
window.renderFrame=renderFrame; window.renderFrameMB=renderFrame; window.ready=Promise.resolve(buildTextures());
</script></body></html>
