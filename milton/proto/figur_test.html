<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../lib/core.js"></script><script src="../lib/style.js"></script><script src="../lib/gravur.js"></script><script src="../lib/siluet.js"></script>
<script src="../lib/prim.js"></script><script src="../lib/figur.js"></script><script src="../lib/kanat.js"></script><script src="../lib/sahne/gol.js"></script>
<script>
// Siluet figür sınama sayfası. ?v=1 beş poz, 2 göl pozu (belden yukarısı, zincir, pelerin), 3 lum süpürmesi (1 → .6 → .3 → 0),
// 6 gerçek göl sahnesi (cizGol) + önerilen figür seçenekleri (?halo=3.5&lines=3; ?halo=0 karşılaştırma), 4 hareket (nefes, pelerin, saç; t ile), 5 yakın plan (h 150). lum 1 ve .6 figürlerinde uzun giysi (robe). Zemin her düzende solda açık, sağda koyu: figür iki zeminde de okunmalı.
const Q=new URLSearchParams(location.search), V=+(Q.get('v')||1);
const cv=document.getElementById('c'); cv.width=DW; cv.height=DH; const ctx=cv.getContext('2d');
// göl pozu (lib/sahne/gol.js için önerilen)
const GOL={ x:0, y:0, h:98, facing:1, twist:.3, lean:.04, head:.42, shTilt:-.06, armN:[-.5,.22], armF:[.55,-.2] };   // iki kol suda (yönetmen kararı)
function split(x0,x1,y0,y1,xs){ const {tx,tone}=GR; const g=tx.createLinearGradient(x0,0,x1,0), u=(xs-x0)/(x1-x0);
  g.addColorStop(0,tone(.82)); g.addColorStop(Math.max(0,u-.03),tone(.9)); g.addColorStop(Math.min(1,u+.03),tone(.16)); g.addColorStop(1,tone(.08)); tx.fillStyle=g; tx.fillRect(x0,y0,x1-x0,y1-y0); }
function chain(x0,y0,x1,y1){ const {tx,tone}=GR; tx.save(); tx.strokeStyle=tone(.55); tx.lineWidth=5; tx.setLineDash([16,6]); tx.beginPath(); tx.moveTo(x0,y0); tx.quadraticCurveTo((x0+x1)/2,(y0+y1)/2+10,x1,y1); tx.stroke(); tx.restore(); }
function renderFrame(t){ const {tx,tone}=GR; GR.begin(.6,0,1); let ms=0;
  const D=(J,o)=>{ const a=performance.now(); SF.draw(J,o); ms=Math.max(ms,performance.now()-a); };
  if(V===1){ split(0,W,0,H,1100); const h=62;
    D(SF.rig({x:250,y:560,h,facing:1,twist:.35,head:.15,armN:[-.15,.35],armF:[.5,.9],legN:[.1,-.1],legF:[-.12,-.05]}),{lum:0,lit:[.8,-.5],t,spear:{grip:'F',ang:.08},cloak:1});
    D(SF.rig({x:600,y:560,h,facing:1,twist:.8,lean:.12,head:-.1,armN:[-.35,.5],armF:[.45,.6],legN:[.45,-.25],legF:[-.4,-.35]}),{lum:.15,lit:[.8,-.5],t,spear:{grip:'F',ang:.2}});
    D(SF.rig({x:930,y:700,h,facing:-1,twist:.7,lean:.35,head:-.3,armN:[.5,.4],armF:[.9,.3],legN:[1.35,-1.6],legF:[.2,-1.5]}),{lum:.3,lit:[-.8,-.5],t,cloak:.7});
    D(SF.rig({x:1400,y:560,h,facing:-1,twist:.3,head:.2,armN:[.3,.6],armF:[-.12,.15],legN:[.08,-.06],legF:[-.08,-.04]}),{lum:1,lit:[-.6,-.7],t,spear:{grip:'N',ang:-.05},cloak:1,robe:true});
    D(SF.rig({x:1730,y:640,h:30,facing:-1,twist:.5,armN:[.1,.2]}),{lum:.9,lit:[-.6,-.7],t,spear:{grip:'N',ang:-.1}});
    D(SF.rig({x:1820,y:640,h:30,facing:1,twist:.5,armN:[.1,.2]}),{lum:0,lit:[.6,-.7],t,cloak:1});
  } else if(V===2||V===4){
    // göl: zifiri gök, ufukta figürün arkasında parlak leke, koyu göl; sol kenar açık şerit (açık zemin sınaması)
    const FX=880, HZ=600, WY=800; tx.fillStyle=tone(.04); tx.fillRect(0,0,W,H);
    let g=tx.createRadialGradient(FX+40,HZ-20,10,FX+40,HZ-20,560); g.addColorStop(0,tone(1)); g.addColorStop(.35,tone(.75)); g.addColorStop(1,tone(.05)); tx.fillStyle=g; tx.fillRect(0,0,W,WY);
    g=tx.createLinearGradient(0,WY,0,H); g.addColorStop(0,tone(.35)); g.addColorStop(1,tone(.05)); tx.fillStyle=g; tx.fillRect(0,WY,W,H-WY);
    GR.px.fillStyle=GR.hatch({th:0,id:8}); GR.px.fillRect(0,WY,W,H-WY);
    tx.fillStyle=tone(.85); tx.fillRect(0,0,260,H);
    const br=Math.sin(t*.6)*2, J=SF.rig(Object.assign({},GOL,{x:FX,y:WY+26+br*.3}));
    for(const sd of [-1,1]){ const P=new Path2D(); P.ellipse(J.shC[0]+sd*260,J.shC[1]+60,250,120,sd*-.35,0,TAU); tx.fillStyle=tone(.03); tx.fill(P); } // koyu kanat yerine sınama kütlesi
    D(J,{lum:+(Q.get('lum')||0),lit:[.55,-.8],t,legs:false,skirt:false,waterY:WY,eye:1,wind:.6,cloak:1.2,halo:+(Q.get('halo')??3.5),lines:+(Q.get('lines')??3)});
    chain(J.wrN[0],J.wrN[1],J.wrN[0]-120,WY+30); chain(J.wrF[0],J.wrF[1],J.wrF[0]+150,WY+30);
    if(V===4){ // aynı figür küçük: telefon boyu (h 40) ve sıçrama denetimi için ikinci kopya (t + 1/30)
      const J2=SF.rig(Object.assign({},GOL,{x:1500,y:WY+10,h:40})); D(J2,{lum:0,lit:[.55,-.8],t:t+1/30,legs:false,skirt:false,waterY:WY,eye:1,wind:.6,cloak:1.2}); }
  } else if(V===5){ // yakın inceleme: büyük boy (h 150), koyu ve açık
    split(0,W,0,H,960);
    D(SF.rig({x:480,y:960,h:150,facing:1,twist:.3,head:.35,armN:[-.3,.4],armF:[.4,.2]}),{lum:0,lit:[.55,-.8],t,legs:false,cloak:1,waterY:1070,wind:.6});
    D(SF.rig({x:1440,y:960,h:150,facing:-1,twist:.3,head:.1,armN:[.5,.45],armF:[-.12,.15]}),{lum:1,lit:[-.55,-.8],t,legs:false,cloak:1,waterY:1070,wind:.6,spear:{grip:'N',ang:-.05}});
  } else if(V===6){
    const ext={halo:+(Q.get('halo')??3.5),lines:+(Q.get('lines')??3)}, d0=SF.draw;
    SF.draw=(J,o)=>{ const a=performance.now(); const r=d0(J,Object.assign({},o,ext)); ms=Math.max(ms,performance.now()-a); return r; };
    try{ cizGol(t,{}); } finally { SF.draw=d0; }
  } else if(V===3){
    const L=[1,.6,.3,0], h=66;
    L.forEach((lum,i)=>{ const x=240+i*480; split(x-240,x+240,0,H,x+30);
      D(SF.rig({x,y:600,h,facing:1,twist:.35,head:.25,armN:[-.3,.5],armF:[.55,.7],legN:[.1,-.08],legF:[-.14,-.05]}),{lum,lit:[.75,-.6],t,cloak:1,spear:{grip:'F',ang:.12},robe:i<2}); });
  }
  console.log("figms",ms.toFixed(1)); GR.engrave(ctx); applyPaper(ctx,.8);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#c00'; ctx.font='20px monospace'; ctx.fillText(`v${V} t=${t} figür en çok ${ms.toFixed(1)} ms`,10,1070); ctx.restore(); }
window.renderFrame=renderFrame; window.renderFrameMB=renderFrame; window.ready=Promise.resolve(buildTextures());
</script></body></html>
