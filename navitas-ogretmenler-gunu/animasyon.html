  Navitas · 24 Kasım Öğretmenler Günü · hareketli Story/Reel (10 sn, 30 fps).
  ?f=story (1080x1920) | ?f=feed (1080x1350). render(t) yalnız zamana bağlıdır (kare kare render).
  After Effects karşılıkları her bloğun başında yazılı. Kurallar: cinecode references/motion.md (MIT).

  Zaman çizelgesi (sn)
   0.00–0.80  Zemin açılır, kamera çok yavaş itme başlar (10 sn boyunca)
   0.15–0.85  Logo: alttan maske açılışı (Track Matte) + bulanıklıktan netliğe
   0.35–1.40  Çerçeve çizgisi kendini çizer (Trim Paths)
   0.45–1.00  Etiket: ölçek spring + harf aralığı daralır (Tracking animator)
   0.80–2.00  Kitaplar tebeşirle çizilir (Trim Paths, alttan üste stagger), dolgu çizgiden sonra
   1.75–2.15  Kitap ayraçları düşer (spring, %5 overshoot)
   1.90–2.35  Elma yukarıdan düşer (ease-in), 2.35'te konar: tebeşir tozu + kitaplar 3 px çöker (ikincil eylem)
   2.45–2.95  Yaprak açılır (follow-through, sap gecikmeli), parlama çizgisi
   2.55–3.15  Kalem sağdan yay çizerek gelir, ters hareketle (anticipation) yaslanır
   2.95–3.35  Pırıltılar merkezden dışa stagger, sonra sinüs nefes
   3.25–3.85  "İyi ki varsınız," kelime kelime taban çizgisinin arkasından yükselir (maske)
   3.70–4.75  "öğretmenim." harf harf: opaklık + y + bulanıklık (Text Animator, range selector)
   4.70–5.40  Alt satırlar sırayla
   4.95–5.50  "öğretmenim" altına tebeşir vurgu çizgisi (Trim Paths, gelişte %80 influence)
   5.80–6.60  Başlıkta tek ışık süpürmesi (CC Light Sweep), filmde bir kez
   5.40–10.0  Bitiş kartı: her şey yerinde, yalnız ortam hareketi (toz, pırıltı, elma nefesi)
-->

<script>
const FEED = new URLSearchParams(location.search).get('f') === 'feed';
if (FEED) document.documentElement.classList.add('feed');
const W = 1080, H = FEED ? 1350 : 1920, DUR = 10, FPS = 30;
window.DUR = DUR; window.FPS = FPS;
if (FEED) { // çerçeveyi 4:5'e uydur
  const f = document.getElementById('frame'); f.setAttribute('height', H);
  fr1.setAttribute('height', H - 90); fr2.setAttribute('height', H - 116);
}

// ---------- hareket kütüphanesi (AE karşılıkları) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const at = (t, s, d) => clamp((t - s) / d);
// AE "Easy Ease" ve hız grafiği etkisi: CSS cubic-bezier çözücü (Newton + ikiye bölme)
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u, sy = u => ((ay * u + by) * u + cy) * u;
  const dx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 6; i++) { const e = sx(u) - x, d = dx(u); if (Math.abs(e) < 1e-6) break; if (Math.abs(d) < 1e-6) break; u -= e / d; }
    let lo = 0, hi = 1; if (Math.abs(sx(u) - x) > 1e-5) { u = x; for (let i = 0; i < 30; i++) { if (sx(u) < x) lo = u; else hi = u; u = (lo + hi) / 2; } }
    return sy(u);
  };
}
const E = {
  easy: bezier(0.33, 0, 0.67, 1),          // AE F9 Easy Ease (etki %33)
  out: bezier(0.16, 1, 0.3, 1),            // hız grafiğinde güçlü çıkış (%~85 etki): yumuşak iniş
  in: bezier(0.7, 0, 0.84, 0),             // yerçekimi gibi hızlanma
  cubicOut: x => 1 - (1 - x) ** 3,
  arrive: bezier(0.333, 0, 0.2, 1),       // AE: çıkış %33, gelişte %80 influence
  sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
};
// sönümlü yay: zeta 0.7 ≈ %5 aşma (lively), 0.8 ≈ %1.5 (soft)
function spring(tau, zeta = 0.7, f = 2) {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (zeta >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + zeta * w / wd * Math.sin(wd * tau));
}
// AE "inertial bounce" ifadesi: anahtar kareden sonra hız * sin(freq*t)/exp(decay*t)
const inertia = (tau, vel, amp = 0.05, freq = 2.2, decay = 6) =>
  tau <= 0 ? 0 : vel * amp * Math.sin(freq * tau * 2 * Math.PI) / Math.exp(decay * tau);
// tohumlu rastgele (render işçileri arasında aynı kare)
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
// AE wiggle: yumuşak değer gürültüsü (tohumlu, zamana bağlı)
function wiggle(t, freq, amp, seed) {
  const r = rng(seed), ph = [r() * 6.28, r() * 6.28, r() * 6.28];
  return amp * (Math.sin(t * freq * 6.28 + ph[0]) * .5 + Math.sin(t * freq * 1.7 * 6.28 + ph[1]) * .3 + Math.sin(t * freq * 2.9 * 6.28 + ph[2]) * .2);
}
const $ = id => document.getElementById(id);

// ---------- metni parçala (Text Animator için) ----------
$('h1').innerHTML = 'İyi ki varsınız,'.split(' ').map(w => `<span class="w">${w}</span>`).join('<span class="w"> </span>');
const H2 = 'öğretmenim.';
$('h2t').innerHTML = [...H2].map(c => `<span class="ch">${c}</span>`).join('');
$('sweep').innerHTML = $('h2t').innerHTML;
const h1w = [...$('h1').querySelectorAll('.w')].filter(e => e.textContent.trim());
const h2c = [...$('h2t').querySelectorAll('.ch')];
const subs = [...$('sub').children];

// tebeşir tozu tanecikleri (elmanın konduğu an): tohumlu
const PUFF = (() => { const r = rng(42); return Array.from({ length: 26 }, () => ({
  x: 250 + r() * 140, side: r() < .5 ? -1 : 1, vx: 60 + r() * 160, vy: -(30 + r() * 120), s: 1.5 + r() * 3.5, life: .6 + r() * .6 })); })();
const puffG = $('puff');
PUFF.forEach(() => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); puffG.appendChild(c); });
// süzülen tebeşir tozu (ortam hareketi)
const MOTES = (() => { const r = rng(7); return Array.from({ length: 18 }, () => ({ x: -20 + r() * 700, y: 60 + r() * 480, s: 1 + r() * 2.2, sp: 6 + r() * 14, ph: r() * 6.28 })); })();
MOTES.forEach(() => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); puffG.appendChild(c); });

const draws = [...document.querySelectorAll('#books .draw')];
const ribs = [...document.querySelectorAll('#books .rib')];
const sparks = [...document.querySelectorAll('.spark')];

function render(t) {
  // kamera: 10 sn boyunca %3 itme (kamera doğrusal da kayabilir; burada sinüs)
  const cam = 1 + 0.03 * E.sine(clamp(t / DUR));
  $('cam').style.transform = `scale(${cam})`;
  $('stage').style.opacity = 1;
  $('bg').style.opacity = 0.5 * E.easy(at(t, 0, 0.8));

  // çerçeve: Trim Paths (iki çizgi, ikincisi 0.12 sn sonra: overlap)
  const fk = E.out(at(t, 0.35, 1.05)), fk2 = E.out(at(t, 0.47, 1.05));
  fr1.style.strokeDasharray = `${fk} 1`; fr2.style.strokeDasharray = `${fk2} 1`;
  fr1.style.strokeOpacity = fk > 0.002 ? 1 : 0; fr2.style.strokeOpacity = fk2 > 0.002 ? 1 : 0;

  // logo: maske arkasından yükselme + bulanıklıktan netliğe
  const lk = E.out(at(t, 0.15, 0.7));
  const logo = $('logo');
  logo.style.transform = `translateY(${(1 - lk) * 150}px)`;
  logo.style.filter = `blur(${(1 - lk) * 8}px)`;
  logo.style.opacity = clamp(lk * 1.6);

  // etiket: spring ölçek (lively) + Tracking 0.40em → 0.16em
  const pk = spring(t - 0.45, 0.72, 2.4);
  const pill = $('pill');
  pill.style.transform = `translateX(-50%) scale(${lerp(0.6, 1, pk)})`;
  pill.style.opacity = clamp((t - 0.45) / 0.15);
  pill.style.letterSpacing = `${lerp(0.4, 0.16, E.out(at(t, 0.45, 0.8)))}em`;

  // kitaplar: alttan üste tebeşir çizimi; çizgi önde, dolgu 0.25 sn arkada (cause → effect)
  const order = [0, 1, 2, 3, 4, 5]; // b3 dış, b3 iç, b2 dış, b2 iç, b1 dış, b1 iç
  draws.forEach((p, i) => {
    const book = Math.floor(i / 2), thin = i % 2;
    const s = 0.8 + book * 0.3 + thin * 0.22, d = thin ? 0.4 : 0.55;
    const k = E.easy(at(t, s, d));
    p.style.strokeDasharray = `${k} 1`; p.style.strokeOpacity = k > 0.002 ? 1 : 0;
    if (!thin) p.style.fillOpacity = E.cubicOut(at(t, s + 0.3, 0.45));
  });
  // ayraçlar: yukarıdan sarkar (scaleY spring)
  ribs.forEach((r, i) => {
    const k = spring(t - (1.75 + i * 0.12), 0.6, 2.6);
    r.style.transformBox = 'fill-box'; r.style.transformOrigin = '50% 0%';
    r.style.transform = `scaleY(${Math.max(0, k)})`;
  });

  // elma: düşüş (ease-in) → 2.35'te temas; kitaplar 3 px çöker; yaylanarak oturur
  const LAND = 2.35, FALL = 0.45;
  let ay, sq = 0;
  if (t < LAND) ay = -120 * (1 - E.in(at(t, LAND - FALL, FALL)));
  else { const tau = t - LAND; ay = -inertia(tau, 1, 18, 2.4, 7); sq = Math.exp(-9 * tau) * Math.cos(tau * 18); }
  const apple = $('apple');
  apple.style.opacity = E.cubicOut(at(t, LAND - FALL, FALL * 0.55));
  apple.style.transformBox = 'fill-box'; apple.style.transformOrigin = '50% 100%';
  // ezilme: hacmi koru (genişler = kısalır), premium tonda küçük: %6
  const sqk = t >= LAND ? 0.06 * sq : -0.04 * E.in(at(t, LAND - FALL, FALL)); // düşerken hafif uzama
  const breath = 1 + 0.008 * Math.sin((t - 3) * 2.1) * clamp(t - 3); // ortam: nefes
  apple.style.transform = `translateY(${ay}px) scale(${(1 + sqk) * breath}, ${(1 - sqk) * breath})`;
  // kitaplar: temasta 3 px çöker, üst kitap daha çok (ikincil eylem, 1–2 kare gecikmeli)
  ['b1', 'b2', 'b3'].forEach((id, i) => {
    const tau = t - LAND - i * 0.035;
    const dip = tau > 0 ? (3 - i) * Math.exp(-10 * tau) * Math.sin(Math.min(tau * 22, Math.PI) ) : 0;
    $(id).style.transform = `translateY(${dip}px)`;
  });
  // toz bulutu (temas noktasından dışa)
  PUFF.forEach((p, i) => {
    const c = puffG.children[i], tau = t - LAND;
    if (tau <= 0 || tau > p.life) { c.setAttribute('r', 0); return; }
    const u = tau / p.life, dr = 1 - Math.exp(-4 * tau);
    c.setAttribute('cx', 320 + p.side * (40 + p.vx * dr));
    c.setAttribute('cy', 334 + p.vy * dr + 60 * tau * tau);
    c.setAttribute('r', p.s * (1 - u * .4));
    c.setAttribute('opacity', 0.55 * (1 - u) ** 1.5);
  });
  // süzülen toz: 3. sn'den itibaren belirir
  MOTES.forEach((m, i) => {
    const c = puffG.children[PUFF.length + i];
    const a = clamp((t - 3) / 1.5) * 0.28;
    c.setAttribute('cx', m.x + wiggle(t, 0.12, 20, i + 3));
    c.setAttribute('cy', m.y - ((t * m.sp) % 60) + wiggle(t, 0.1, 8, i + 50));
    c.setAttribute('r', m.s); c.setAttribute('opacity', a * (0.5 + 0.5 * Math.sin(t * 1.3 + m.ph)));
  });

  // sap + yaprak: follow-through (sap önce, yaprak 0.08 sn sonra, küçük aşmayla)
  const stk = E.out(at(t, 2.42, 0.3));
  $('stem').style.strokeDasharray = `${stk} 1`; $('stem').style.strokeOpacity = stk > 0.002 ? 1 : 0;
  const lfk = spring(t - 2.5, 0.55, 2.2);
  const leaf = $('leaf');
  leaf.style.transformBox = 'view-box'; leaf.style.transformOrigin = '334px 124px';
  const sway = t > 3.2 ? 2.5 * Math.sin((t - 3.2) * 1.6) : 0;
  leaf.style.transform = `rotate(${lerp(-70, 0, lfk) + sway}deg) scale(${clamp(lfk * 1.2)})`;
  const hlk = E.out(at(t, 2.65, 0.35)); $('hl').style.strokeDasharray = `${hlk} 1`; $('hl').style.strokeOpacity = hlk > 0.002 ? 1 : 0;

  // kalem: sağdan yay çizerek gelir; anticipation (ters dönme) sonra yaslanır, spring
  const pk2 = E.out(at(t, 2.55, 0.5));
  const px = lerp(320, 0, pk2), py = -Math.sin(Math.PI * pk2) * 70 + lerp(60, 0, pk2);
  const rotS = spring(t - 2.85, 0.5, 2.0);
  const rot = t < 2.85 ? lerp(-14, -20, E.out(at(t, 2.55, 0.3))) : lerp(-20, 0, rotS);
  const pen = $('pencil');
  pen.style.transformBox = 'view-box'; pen.style.transformOrigin = '540px 520px';
  pen.style.opacity = clamp((t - 2.55) / 0.12);
  pen.style.transform = `translate(${px}px, ${py}px) rotate(${rot}deg)`;

  // pırıltılar: merkezden dışa stagger, pop (bouncy, tek vurgu) + sinüs nefes
  sparks.forEach((s, i) => {
    const order = [1, 0, 2][i];
    const k = spring(t - (2.95 + order * 0.08), 0.5, 3);
    const tw = t > 3.6 ? 0.82 + 0.18 * Math.sin((t - 3.6) * 3 + i * 2.1) : 1;
    s.style.transformBox = 'fill-box'; s.style.transformOrigin = '50% 50%';
    s.style.transform = `scale(${Math.max(0, k) * tw}) rotate(${(1 - clamp(k)) * 60}deg)`;
  });

  // "İyi ki varsınız,": kelime kelime taban çizgisinin arkasından (maske) yükselir
  h1w.forEach((w, i) => {
    const k = E.out(at(t, 3.25 + i * 0.09, 0.6));
    w.style.transform = `translateY(${(1 - k) * 160}%)`;
  });

  // "öğretmenim.": Text Animator — opaklık + y + bulanıklık, range selector 1 karelik stagger x2
  h2c.forEach((c, i) => {
    const s = 3.7 + i * 0.055, k = E.out(at(t, s, 0.75));
    const ky = spring(t - s, 0.75, 2.2);
    c.style.opacity = clamp(k * 1.4);
    c.style.transform = `translateY(${(1 - ky) * 60}px) rotate(${(1 - k) * -8}deg)`;
    c.style.filter = k < 1 ? `blur(${(1 - k) * 14}px)` : 'none';
  });

  // vurgu: tebeşir alt çizgisi (Trim Paths, influence %80)
  const ulk = E.arrive(at(t, 4.95, 0.55));
  $('ul').style.strokeDasharray = `${ulk} 1`; $('ul').style.strokeOpacity = ulk > 0.002 ? 0.9 : 0;

  // tek ışık süpürmesi (CC Light Sweep): yumuşak bant soldan sağa
  const sk = E.easy(at(t, 5.8, 0.8));
  const sw = $('sweep');
  const pos = lerp(-30, 130, sk);
  sw.style.opacity = sk > 0 && sk < 1 ? 1 : 0;
  sw.style.webkitMaskImage = `linear-gradient(100deg, transparent ${pos - 14}%, #000 ${pos}%, transparent ${pos + 14}%)`;

  // alt satırlar: sırayla, küçük kayma; okunur kalsın diye bulanıklık yok
  subs.forEach((d, i) => {
    const k = E.out(at(t, 4.7 + i * 0.16, 0.6));
    d.style.opacity = k; d.style.transform = `translateY(${(1 - k) * 26}px)`;
  });
}

window.render = render;
const img = $('logo'); img.src = LOGO_WHITE.src;
window.ready = Promise.all([document.fonts.ready, img.decode()]).then(() => render(0));
// önizleme: ?play
if (new URLSearchParams(location.search).has('play')) {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body></html>
