<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dünya Kahve Günü</title>
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(fonts/serif-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(fonts/serif-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1E00-1E9F; }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(fonts/serif-italic-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(fonts/serif-italic-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1E00-1E9F; }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url(fonts/inter-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url(fonts/inter-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1E00-1E9F; }
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { height: 100vh; width: auto; max-width: 100vw; aspect-ratio: 9 / 16; }
  body.render canvas { width: 1080px; height: 1920px; max-width: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="logo.js"></script>
<script>
/*
 * Dünya Kahve Günü — Instagram Story, 9 sn, 1080x1920. render(t) yalnızca zamana bağlıdır.
 * Her şey 120 BPM vuruş ızgarasına oturur (vuruş = 0.5 sn); her vuruşta ekranda bir şey değişir.
 *
 *   S1  0.00 – 1.10  Turuncu: "BUGÜN" ilk karede çarparak girer, çekirdekler uçuşur, "DÜNYA KAHVE GÜNÜ"
 *   ~   0.85 – 1.10  Espresso daire ekranı kaplar
 *   S2  0.85 – 2.50  Kuşbakışı Türk kahvesi fincanı, dönen köpük; "KAHVELER"; 1.5'te çekirdek patlaması
 *   ~   2.20 – 2.50  Kamera köpüğe dalar (köpük ekranı kaplar)
 *   S3  2.50 – 4.05  Karamel: "KAHVELER bizden!" harf harf, alt çizgi, parıltılar
 *   S4  3.90 – 6.00  Eğik kayan şeritler: "BÜTÜN GÜN", fincanlar, "SABAHTAN AKŞAMA"
 *   S5  5.65 – 9.00  Krem şerit ekranı kaplar → kapanış: logo, "Bütün gün kahveler bizden.", ikram notu
 */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920, DUR = 9, FPS = 30;

const C = {
  orange: '#E17610', orangeD: '#D05C20', orangeL: '#F29100', navy: '#202F50',
  cream: '#F4ECE1', ink: '#1C1714', espresso: '#24170F', white: '#FFFCF6',
  caramel: '#C9772E', foamL: '#F2B370', coffee: '#4A2A18', beanC: '#B86A2E',
};
const SERIF = "'Instrument Serif'", SANS = 'Inter';

// ---------- yardımcılar ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInCubic = x => x * x * x;
const easeOutBack = (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const easeInOutQuint = x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const TAU = Math.PI * 2;

function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function fill(c) { ctx.fillStyle = c; ctx.fill(); }

// Vuruşlarda kısa kamera sarsıntısı
const HITS = [0.0, 0.5, 1.0, 1.5, 2.5, 3.0, 4.0, 6.0];
function shake(t) {
  let x = 0, y = 0;
  for (const h of HITS) {
    const d = t - h;
    if (d < 0 || d > 0.3) continue;
    const a = 16 * Math.exp(-d * 18);
    x += a * Math.sin(d * 95); y += a * Math.cos(d * 77);
  }
  return [x, y];
}
// Vuruşta kısa ölçek "pompası"
function bump(t, hits, amt = 0.06) {
  let s = 1;
  for (const h of hits) if (t >= h) s += amt * Math.exp(-(t - h) * 10);
  return s;
}

// ---------- tipografi ----------
function setFont(style, weight, size, family, ls = 0) {
  ctx.font = `${style} ${weight} ${size}px ${family}`; ctx.letterSpacing = ls + 'px';
}
function fitSize(str, style, weight, family, size, maxW, ls) {
  setFont(style, weight, size, family, ls);
  const w = ctx.measureText(str).width;
  return w > maxW ? size * maxW / w : size;
}
// Büyük yazı: ekrana "çarpar" (büyükten küçülerek oturur), çıkışta yukarı fırlar
function slam(str, x, y, o) {
  const { t, t0, size, color, weight = 900, family = SANS, style = '', dur = 0.5, from = 1.6, ls = -4, maxW = 920,
          rot = 0, outT = null, outDur = 0.25 } = o;
  const p = prog(t, t0, t0 + dur);
  if (p <= 0) return;
  let a = clamp(p * 5), sc = 1 + (from - 1) * (1 - easeOutExpo(p)), dy = 0;
  if (outT != null) {
    const q = prog(t, outT, outT + outDur);
    if (q >= 1) return;
    a *= 1 - q; sc *= 1 - 0.25 * easeInExpo(q); dy = -160 * easeInExpo(q);
  }
  const fs = fitSize(str, style, weight, family, size, maxW, ls);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y + dy); ctx.rotate(rot * (1 - easeOutExpo(p))); ctx.scale(sc, sc);
  setFont(style, weight, fs, family, ls); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(str, ls / 2, 0);
  ctx.restore();
}
// Harf harf zıplayarak giren yazı
function charsPop(str, x, y, o) {
  const { t, t0, size, color, weight = 400, family = SERIF, style = 'italic', stagger = 0.04, ls = -4, maxW = 940,
          outT = null, outDur = 0.25 } = o;
  const fs = fitSize(str, style, weight, family, size, maxW, ls);
  setFont(style, weight, fs, family, ls);
  const chars = [...str], ws = chars.map(c => ctx.measureText(c).width);
  let cx = x - ws.reduce((a, b) => a + b, 0) / 2;
  const q = outT == null ? 0 : prog(t, outT, outT + outDur);
  if (q >= 1) return;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  chars.forEach((ch, i) => {
    const p = prog(t, t0 + i * stagger, t0 + i * stagger + 0.45);
    if (p > 0) {
      const sc = Math.max(0, easeOutBack(p, 2.6)) * (1 - 0.25 * easeInExpo(q));
      ctx.save(); ctx.globalAlpha *= clamp(p * 4) * (1 - q);
      ctx.translate(cx + ws[i] / 2, y + (1 - easeOutCubic(p)) * 90 - 160 * easeInExpo(q));
      ctx.rotate(-0.25 * (1 - easeOutCubic(p))); ctx.scale(sc, sc);
      ctx.fillText(ch, 0, 0); ctx.restore();
    }
    cx += ws[i];
  });
  ctx.restore();
}
function pill(str, x, y, o) {
  const { t, t0, size = 40, bg = C.navy, fg = C.cream, ls = 5, outT = null } = o;
  const p = prog(t, t0, t0 + 0.45);
  if (p <= 0) return;
  const q = outT == null ? 0 : prog(t, outT, outT + 0.25);
  const sc = Math.max(0, easeOutBack(p, 2.2)) * (1 - easeInExpo(q));
  if (sc <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  setFont('', 800, size, SANS, ls);
  const w = ctx.measureText(str).width + size * 1.6, h = size * 2;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); fill(bg);
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, ls / 2, size * 0.06);
  ctx.restore();
}

// ---------- çizimler: düz, kalın, geometrik ----------
function bean(x, y, s, rot, body = C.espresso, crease = C.cream) {
  if (s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.beginPath(); ctx.ellipse(0, 0, 40, 56, 0, 0, TAU); fill(body);
  ctx.beginPath(); ctx.moveTo(5, -47); ctx.bezierCurveTo(-21, -16, 21, 16, -5, 47);
  ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.strokeStyle = crease; ctx.stroke();
  ctx.restore();
}
function sparkle(x, y, s, rot, color) {
  if (s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.lineTo(Math.cos(a) * 34, Math.sin(a) * 34);
    ctx.quadraticCurveTo(0, 0, Math.cos(a + Math.PI / 2) * 34, Math.sin(a + Math.PI / 2) * 34);
  }
  fill(color); ctx.restore();
}
// Türk kahvesi köpüğü: dönen iki kollu sarmal + kabarcıklar (yerel koordinat, merkez 0,0)
const BUBBLES = (() => { const r = rng(77); return Array.from({ length: 54 }, () => ({ a: r() * TAU, d: Math.sqrt(r()) * 0.9, s: 0.006 + r() * 0.022, l: r() < 0.6 })); })();
function foam(R, ang, a = 1) {
  ctx.save(); ctx.rotate(ang); ctx.lineCap = 'round'; ctx.strokeStyle = C.foamL;
  for (const ph of [0, Math.PI]) {
    ctx.beginPath();
    for (let k = 0; k <= 90; k++) {
      const q = k / 90, rr = R * 0.92 * q, aa = ph + q * 7.2;
      k ? ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr) : ctx.moveTo(0, 0);
    }
    ctx.globalAlpha = 0.65 * a; ctx.lineWidth = R * 0.055; ctx.stroke();
  }
  for (const b of BUBBLES) {
    ctx.globalAlpha = (b.l ? 0.85 : 0.5) * a;
    circle(Math.cos(b.a) * b.d * R, Math.sin(b.a) * b.d * R, b.s * R); fill(b.l ? C.foamL : C.cream);
  }
  ctx.restore();
}
// Kuşbakışı Türk kahvesi fincanı
function cupTop(cx, cy, R, ang, saucer = true) {
  if (R <= 0) return;
  ctx.save(); ctx.translate(cx, cy);
  if (saucer) {
    circle(0, 0, R * 1.34); fill(C.cream);
    ctx.lineWidth = R * 0.025; ctx.strokeStyle = 'rgba(28,23,20,0.08)'; circle(0, 0, R * 1.14); ctx.stroke();
  }
  circle(R * 0.07, R * 0.1, R); fill('rgba(28,23,20,0.25)');                        // gölge
  ctx.save(); ctx.rotate(-0.55); ctx.beginPath(); ctx.roundRect(R * 0.8, -R * 0.14, R * 0.56, R * 0.28, R * 0.14); fill(C.white); ctx.restore(); // kulp
  circle(0, 0, R); fill(C.white);
  circle(0, 0, R * 0.87); fill(C.coffee);
  circle(0, 0, R * 0.83); fill(C.caramel);
  ctx.save(); circle(0, 0, R * 0.83); ctx.clip(); foam(R * 0.83, ang); ctx.restore();
  ctx.lineCap = 'round'; ctx.lineWidth = R * 0.035; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.arc(0, 0, R * 0.935, -2.5, -1.5); ctx.stroke();               // parlama
  ctx.restore();
}

// ---------- S1: BUGÜN ----------
const S1_BEANS = [[150, 470, -0.5, 1.1], [930, 560, 0.6, 0.9], [120, 1430, 0.3, 0.85], [950, 1390, -0.7, 1.2], [300, 1650, 0.9, 0.7], [800, 1690, -0.2, 0.8], [560, 380, 1.4, 0.6]];
function scene1(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.orangeL); g.addColorStop(1, C.orangeD);
  ctx.fillStyle = g; ctx.fillRect(-50, -50, W + 100, H + 100);
  S1_BEANS.forEach(([x, y, r, s], i) => {
    const p = easeOutExpo(prog(t, -0.2 + i * 0.07, 0.5 + i * 0.07));
    const bx = lerp(540 + (x - 540) * 2.2, x, p), by = lerp(960 + (y - 960) * 2.2, y, p) + Math.sin(t * 2.5 + i) * 10;
    bean(bx, by, s * p, r + t * 0.8 * (i % 2 ? 1 : -1));
  });
  const b = bump(t, [0.5]);
  ctx.save(); ctx.translate(540, 960); ctx.scale(b, b); ctx.translate(-540, -960);
  slam('BUGÜN', 540, 930, { t, t0: -0.14, size: 280, color: C.cream, from: 1.7, rot: -0.08 });
  ctx.restore();
  pill('DÜNYA KAHVE GÜNÜ', 540, 1150, { t, t0: 0.5, size: 42 });
}

// ---------- S2: fincan + KAHVELER ----------
const CUP = { x: 540, y: 1100, R: 290 };
function cupZoom(t) { return 1 + 9 * easeInExpo(prog(t, 2.2, 2.5)); }
function scene2(t) {
  ctx.fillStyle = C.espresso; ctx.fillRect(-50, -50, W + 100, H + 100);
  const pop = easeOutBack(prog(t, 0.92, 1.35), 1.7), z = cupZoom(t);
  // çekirdek patlaması: fincanın altından dışarı
  for (let i = 0; i < 11; i++) {
    const p = prog(t, 1.5, 2.4);
    if (p <= 0) break;
    const a = i / 11 * TAU + 0.35, d = lerp(120, 470 + (i % 3) * 110, easeOutExpo(p));
    bean(CUP.x + Math.cos(a) * d * z, CUP.y + Math.sin(a) * d * z, (0.75 + (i % 3) * 0.18) * Math.min(1, p * 4) * z,
         a + p * 6 * (i % 2 ? 1 : -1), C.beanC, C.espresso);
  }
  const s = pop * bump(t, [1.5, 2.0], 0.05);
  cupTop(CUP.x, CUP.y, CUP.R * s * z, t * 1.3);
  slam('KAHVELER', 540, 450, { t, t0: 1.0, size: 190, color: C.cream, from: 1.5, outT: 2.2 });
}

// ---------- S3: KAHVELER bizden! ----------
function scene3(t) {
  ctx.fillStyle = C.caramel; ctx.fillRect(-50, -50, W + 100, H + 100);
  // köpüğün içindeyiz: dev sarmal yavaşça döner
  ctx.save(); ctx.translate(CUP.x, CUP.y);
  foam(CUP.R * 0.83 * 10, t * 1.3, lerp(1, 0.35, easeOutCubic(prog(t, 2.5, 3.1))));
  ctx.restore();
  const b = bump(t, [3.0, 3.5], 0.04);
  ctx.save(); ctx.translate(540, 1000); ctx.scale(b, b); ctx.translate(-540, -1000);
  slam('KAHVELER', 540, 790, { t, t0: 2.5, size: 170, color: C.navy, from: 1.35, outT: 3.9 });
  charsPop('bizden!', 540, 1060, { t, t0: 2.6, size: 360, color: C.cream, outT: 3.92 });
  // el çizimi alt çizgi
  const u = easeOutCubic(prog(t, 3.0, 3.35)) * (1 - prog(t, 3.9, 4.05));
  if (u > 0) {
    ctx.lineCap = 'round'; ctx.strokeStyle = C.navy;
    for (let k = 0; k < 40 * u; k++) {
      const q = k / 40, x0 = 250 + q * 580, x1 = x0 + 14.5;
      ctx.lineWidth = 18 * Math.sin(Math.PI * Math.min(1, q * 1.05 + 0.03)) + 3;
      ctx.beginPath(); ctx.moveTo(x0, 1250 + Math.sin(q * 7) * 10 - q * 18); ctx.lineTo(x1, 1250 + Math.sin((q + 0.025) * 7) * 10 - (q + 0.025) * 18); ctx.stroke();
    }
  }
  ctx.restore();
  // parıltı patlaması
  const sp = prog(t, 3.0, 3.6);
  if (sp > 0 && sp < 1) {
    [[180, 760], [900, 720], [150, 1220], [930, 1300], [540, 560], [300, 1380]].forEach(([x, y], i) => {
      sparkle(x, y, (0.6 + (i % 2) * 0.5) * Math.sin(sp * Math.PI), sp * 3 + i, i % 2 ? C.cream : C.navy);
    });
  }
}

// ---------- S4: kayan şeritler ----------
const BAND_ROT = -0.12;
function marquee(str, size, color, speed, t, weight = 900, style = '', family = SANS) {
  setFont(style, weight, size, family, -2);
  const w = ctx.measureText(str).width;
  const off = ((t * speed) % w + w) % w;
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let x = -1300 - off; x < 1300; x += w) ctx.fillText(str, x, size * 0.04);
}
function band(t, yc, h, color, enterT, dir, content, outDir) {
  const pin = easeOutExpo(prog(t, enterT, enterT + 0.35));
  const pout = outDir ? easeInExpo(prog(t, 5.58, 5.82)) : 0;
  if (pin <= 0) return;
  ctx.save(); ctx.translate(540 + dir * 1500 * (1 - pin) + outDir * 2800 * pout, yc); ctx.rotate(BAND_ROT);
  ctx.fillStyle = color; ctx.fillRect(-1400, -h / 2, 2800, h);
  ctx.beginPath(); ctx.rect(-1400, -h / 2, 2800, h); ctx.clip();
  content();
  ctx.restore();
}
function scene4(t) {
  const bg = prog(t, 3.9, 4.2);
  ctx.fillStyle = C.orange; ctx.fillRect(-50, -50, W + 100, H + 100);
  if (bg < 1) { ctx.globalAlpha = 1 - bg; ctx.fillStyle = C.caramel; ctx.fillRect(-50, -50, W + 100, H + 100); ctx.globalAlpha = 1; }
  const b = bump(t, [4.5, 5.0, 5.5], 0.035);
  ctx.save(); ctx.translate(540, 960); ctx.scale(b, b); ctx.translate(-540, -960);
  band(t, 700, 240, C.navy, 3.9, 1, () => marquee('BÜTÜN GÜN • BÜTÜN GÜN • ', 160, C.cream, -520, t), -1);
  // orta şerit (krem) kapanışta büyüyüp ekranı kaplar
  const grow = easeInOutQuint(prog(t, 5.65, 6.0));
  const h2 = lerp(250, 4400, grow);
  const pin = easeOutExpo(prog(t, 3.95, 4.3));
  if (pin > 0) {
    ctx.save(); ctx.translate(540 - 1500 * (1 - pin), 960); ctx.rotate(BAND_ROT * (1 - grow));
    ctx.fillStyle = C.cream; ctx.fillRect(-1400, -h2 / 2, 2800, h2);
    ctx.beginPath(); ctx.rect(-1400, -125, 2800, 250); ctx.clip();
    ctx.globalAlpha = 1 - prog(t, 5.62, 5.76);
    const off = (t * 300) % 300;
    for (let x = -1500 + off; x < 1400; x += 300) {
      cupTop(x, 0, 72, t * 2 + x * 0.01);
      bean(x + 150, 0, 0.75, t * 2 + x, C.espresso, C.cream);
    }
    ctx.restore();
  }
  band(t, 1220, 240, C.navy, 4.0, 1, () => marquee('SABAHTAN AKŞAMA • ', 120, C.orangeL, -420, t), 1);
  ctx.restore();
}

// ---------- S5: kapanış kartı ----------
let logoImg = null;
const S5_BEANS = [[75, 640, -0.5, 0.6], [1005, 1010, 0.7, 0.55], [80, 1330, 0.4, 0.5], [1000, 1580, -0.3, 0.65]];
function scene5(t) {
  ctx.fillStyle = C.cream; ctx.fillRect(-50, -50, W + 100, H + 100);
  S5_BEANS.forEach(([x, y, r, s], i) => {
    const p = easeOutBack(prog(t, 6.5 + i * 0.08, 6.95 + i * 0.08), 2);
    bean(x, y + Math.sin(t * 2 + i) * 8, s * Math.max(0, p), r + t * 0.5 * (i % 2 ? 1 : -1), C.orange, C.cream);
  });
  // logo
  const pl = prog(t, 6.0, 6.6);
  if (pl > 0 && logoImg) {
    const lw = 560, lh = lw * LOGO.h / LOGO.w, lx = 540 - lw / 2, ly = 330;
    ctx.save(); ctx.beginPath(); ctx.rect(lx - 10, ly - 10, lw + 20, lh + 20); ctx.clip();
    ctx.drawImage(logoImg, lx, ly + (1 - easeOutExpo(pl)) * (lh + 20), lw, lh); ctx.restore();
  }
  const b = bump(t, [7.0], 0.03);
  ctx.save(); ctx.translate(540, 1050); ctx.scale(b, b); ctx.translate(-540, -1050);
  slam('BÜTÜN GÜN', 540, 820, { t, t0: 6.0, size: 140, color: C.navy, from: 1.4, ls: -3 });
  slam('KAHVELER', 540, 965, { t, t0: 6.15, size: 140, color: C.navy, from: 1.4, ls: -3 });
  charsPop('bizden.', 540, 1150, { t, t0: 6.3, size: 250, color: C.orange });
  ctx.restore();
  const ps = easeOutExpo(prog(t, 6.7, 7.3));
  if (ps > 0) {
    ctx.save(); ctx.globalAlpha = ps; setFont('', 500, 46, SANS, -0.5);
    ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Tüm misafirlerimize ikramımızdır.', 540, 1330 + (1 - ps) * 30);
    ctx.restore();
  }
  pill('1 EKİM · DÜNYA KAHVE GÜNÜ', 540, 1470, { t, t0: 6.95, size: 34, bg: C.navy, fg: C.cream });
}

// ---------- kare çizimi ----------
let grain = null;
function makeGrain() {
  grain = document.createElement('canvas'); grain.width = grain.height = 256;
  const g = grain.getContext('2d'), img = g.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

function render(t, grainFrame = Math.floor(t * FPS)) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
  ctx.fillStyle = C.espresso; ctx.fillRect(0, 0, W, H);
  const [sx, sy] = shake(t);
  ctx.save(); ctx.translate(sx, sy);
  if (t < 0.85) {
    scene1(t);
  } else if (t < 1.12) {
    scene1(t);
    const r = lerp(0, 1350, easeInOutQuint(prog(t, 0.85, 1.12)));
    ctx.save(); circle(540, 960, r); ctx.clip(); scene2(t); ctx.restore();
  } else if (t < 2.5) {
    scene2(t);
  } else if (t < 3.9) {
    scene3(t);
  } else if (t < 6.0) {
    if (t < 4.1) { scene3(t); }
    scene4(t);
  } else {
    scene5(t);
  }
  ctx.restore();
  // film greni
  ctx.save(); ctx.globalAlpha = 0.04; ctx.globalCompositeOperation = 'overlay';
  const r = rng(grainFrame + 1);
  ctx.translate(-r() * 256, -r() * 256);
  ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}

// Hareket bulanıklığı: 180° obtüratör (yarım kare pozlama), alt karelerin yürüyen ortalaması
let acc = null;
function renderMB(t, n = 8, shutter = 0.5) {
  if (!acc) { acc = document.createElement('canvas'); acc.width = W; acc.height = H; }
  const a = acc.getContext('2d'), f = Math.round(t * FPS);
  for (let k = 0; k < n; k++) {
    render(t + ((k + 0.5) / n - 0.5) * shutter / FPS, f);
    a.globalAlpha = 1 / (k + 1); a.drawImage(cv, 0, 0);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(acc, 0, 0);
}

// ---------- başlat ----------
const params = new URLSearchParams(location.search);
window.renderFrame = render;
window.renderFrameMB = renderMB;
window.DUR = DUR; window.FPS = FPS;
window.ready = (async () => {
  makeGrain();
  if (window.LOGO) { const im = new Image(); im.src = LOGO.src; await im.decode(); logoImg = im; }
  const sample = 'AaÜüİıŞşĞğÇçÖö•·!';
  await Promise.all([
    document.fonts.load(`italic 400 80px ${SERIF}`, sample),
    document.fonts.load(`900 80px ${SANS}`, sample),
    document.fonts.load(`800 40px ${SANS}`, sample),
    document.fonts.load(`500 40px ${SANS}`, sample),
  ]);
  await document.fonts.ready;
})();

window.ready.then(() => {
  if (params.has('render')) { document.body.classList.add('render'); return; }
  if (params.has('t')) { render(parseFloat(params.get('t'))); return; }
  let start = performance.now();
  cv.addEventListener('click', () => { start = performance.now(); });
  const loop = now => { render(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
